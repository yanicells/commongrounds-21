{% extends "base.html" %}
{% block title %}Product Form{% endblock %}
{% block content %}
  <h2>{% if product %}Edit{% else %}Create{% endif %} Product</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Product</button>
  </form>
{% endblock %}
