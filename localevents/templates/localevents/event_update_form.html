{% extends "base.html" %}
{% load static %}
{% block title %}Update Event{% endblock %}
{% block content %}
<h2>Update Event: {{ event.title }}</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save Changes</button>
</form>
{% endblock content %}
