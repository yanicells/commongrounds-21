{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<h2>Set New Password</h2>
{% if validlink %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% else %}
<p>Invalid password reset link.</p>
{% endif %}
{% endblock %}
