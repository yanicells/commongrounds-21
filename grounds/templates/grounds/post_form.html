{% extends 'base.html' %}

{% block title %}{% if object %}Edit{% else %}Create{% endif %} Post{% endblock %}

{% block content %}
<h2>{% if object %}Edit{% else %}Create{% endif %} Post</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{% if object %}Save Changes{% else %}Post to Grounds{% endif %}</button>
</form>

<br>
<a href="{% url 'grounds:post-list' %}">Back to Grounds</a>
{% endblock %}
