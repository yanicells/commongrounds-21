{% extends 'base.html' %}
{% load static %}

{% block title %}DIY Projects{% endblock %}

{% block content %}
<h2>DIY Projects</h2>
<ul>
  {% for project in projects %}
  <li>
    <a href="{{ project.get_absolute_url }}"> {{ project.title }} </a>
  </li>
  {% empty %}
  <li>No projects available</li>
  {% endfor %}
</ul>
<a href="{% url 'home' %}">Back to home</a>
{% endblock %}
